name: Deploy (produção)

# Automatiza o deploy manual documentado em tools/deploy/README.md:
# build dos 2 apps -> zip de release -> scp -> swap com backup -> healthcheck
# (com rollback automático) -> purge de cache.
#
# Secrets necessários no repo (Settings > Secrets and variables > Actions):
#   DEPLOY_SSH_KEY   chave PRIVADA SSH (conteúdo do arquivo, não o caminho)
#   DEPLOY_SSH_HOST  host ou IP do servidor
#   DEPLOY_SSH_USER  usuário SSH
#   DEPLOY_SSH_PORT  porta SSH
#   DEPLOY_SSH_SITE  domínio sob ~/domains/ (ex.: guardiaokids.site)

on:
  push:
    tags: ['v*']        # dispara ao cortar a tag de release
  workflow_dispatch:    # botão manual (Actions > Deploy > Run workflow)

concurrency:
  group: deploy-production
  cancel-in-progress: false   # nunca cancela um deploy no meio

permissions:
  contents: read

jobs:
  deploy:
    name: Build + deploy em produção
    runs-on: ubuntu-latest
    # Ative "Required reviewers" neste environment (Settings > Environments)
    # para exigir aprovação manual antes de cada deploy.
    environment: production

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP 8.2 (build-release-zip)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, mbstring, fileinfo
          tools: none

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            public/app-parent/pnpm-lock.yaml
            public/app-child/pnpm-lock.yaml

      - name: Build app-parent
        working-directory: public/app-parent
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build app-child
        working-directory: public/app-child
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Empacota o zip de release
        run: |
          VERSION=$(grep -oP '^\s*\*\s*Version:\s*\K.+' guardkids.php | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then echo "Não achei a Version em guardkids.php"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          php scripts/build-release-zip.php guardkids-wp.zip
          echo "Zip da v$VERSION pronto:"; ls -la guardkids-wp.zip

      - name: Configura SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts || { echo "ssh-keyscan não retornou host key"; exit 1; }

      - name: Envia o zip (scp)
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_SSH_PORT" \
              -o BatchMode=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              guardkids-wp.zip "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:/tmp/guardkids-wp-deploy.zip"

      - name: Deploy + healthcheck + rollback
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_SITE: ${{ secrets.DEPLOY_SSH_SITE }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_SSH_PORT" \
              -o BatchMode=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
              "export DEPLOY_VERSION='$VERSION' DEPLOY_SITE='$DEPLOY_SSH_SITE'; bash -s" <<'REMOTE'
          set -euo pipefail
          PLUGINS="$HOME/domains/$DEPLOY_SITE/public_html/wp-content/plugins"
          WPROOT="$HOME/domains/$DEPLOY_SITE/public_html"
          ZIP="/tmp/guardkids-wp-deploy.zip"
          test -f "$ZIP"

          cd "$PLUGINS"
          BAK="guardkids-wp.bak-$(date +%Y%m%d-%H%M%S)"
          if [ -d guardkids-wp ]; then cp -r guardkids-wp "$BAK"; fi

          rm -rf guardkids-wp
          unzip -q "$ZIP" -d "$PLUGINS"   # o zip carrega o prefixo guardkids-wp/
          rm -f "$ZIP"

          # --- Healthcheck ---
          cd "$WPROOT"
          GOT=$(wp plugin get guardkids-wp --field=version 2>/dev/null || echo ERR)
          HOME_CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://$DEPLOY_SITE/" || echo 000)
          PANEL_CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://$DEPLOY_SITE/painel-pais" || echo 000)

          ok=1
          [ "$GOT" = "$DEPLOY_VERSION" ] || ok=0
          echo "$HOME_CODE"  | grep -qE '^(200|301|302)$' || ok=0
          echo "$PANEL_CODE" | grep -qE '^(200|301|302)$' || ok=0

          if [ "$ok" -ne 1 ]; then
            echo "HEALTHCHECK FALHOU — version=$GOT (esperado $DEPLOY_VERSION) home=$HOME_CODE panel=$PANEL_CODE"
            echo "Fazendo rollback..."
            cd "$PLUGINS"
            rm -rf guardkids-wp
            [ -d "$BAK" ] && mv "$BAK" guardkids-wp
            (cd "$WPROOT" && wp litespeed-purge all >/dev/null 2>&1) || true
            exit 1
          fi

          echo "Deploy OK — guardkids-wp $GOT (home=$HOME_CODE painel=$PANEL_CODE)"
          echo "db_version=$(wp option get guardkids_db_version 2>/dev/null || echo '?')"
          wp litespeed-purge all >/dev/null 2>&1 || true

          # Poda backups: mantém os 3 mais recentes
          cd "$PLUGINS"
          ls -1dt guardkids-wp.bak-* 2>/dev/null | tail -n +4 | xargs -r rm -rf
          REMOTE
